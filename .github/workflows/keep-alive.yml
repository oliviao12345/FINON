name: keep-alive

# The free API host goes to sleep after about 15 minutes without a visit, and waking it
# takes up to a minute. A light, read-only request every 10 minutes keeps it awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the accounts list
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 -o /dev/null https://finon-api.onrender.com/api/accounts
